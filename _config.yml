# Site configuration for Niloy Deb's academic website (AcademicPages / Minimal Mistakes).
# Jekyll does NOT reload this file while `jekyll serve` is running; restart the server after editing.


# ---------------------------------------------------------------------------
# Site
# ---------------------------------------------------------------------------
locale                   : "en-US"
title                    : "Niloy Deb / Home"
title_separator          : "-"
name                     : &name "Niloy Deb"
description              : &description "Niloy Deb, Lecturer, PMRE, BUET. Research in CFD, reduced-order modeling, scientific machine learning, turbulence, and flow through porous media."
url                      : "https://niloydebme.github.io"   # host (no trailing slash)
baseurl                  : "/webpage"                       # repository name; "" if the repo is <user>.github.io
repository               : "niloydebme/webpage"


# ---------------------------------------------------------------------------
# Author (sidebar). Blank fields are hidden.
# ---------------------------------------------------------------------------
author:
  avatar           : "profile1.png"   # file in /images/
  name             : "Niloy Deb"
  pronouns         :
  bio              : "Mechanical Engineering Graduate <span class='bio-highlight'> Differentiable Physics · SciML · CFD · Multiphysics Flow · Turbulence </span>"
  location         : "Dhaka, Bangladesh"
  employer         :
  uri              :
  email            : "niloydeb@pmre.buet.ac.bd"
  # Header block (minimal layout): position lines under the name, and the CV link
  header_lines:
    - "Lecturer"
    - "Department of Petroleum and Mineral Resources Engineering"
    - "Bangladesh University of Engineering and Technology (BUET)"
  address          : "Room: OAB 202 (B), Old Academic Building, BUET, Dhaka 1000, Bangladesh"
  email_display    : "niloydeb [at] pmre [dot] buet [dot] ac [dot] bd"   # shown as text, not a mailto link
  cv_pdf           : "https://www.dropbox.com/scl/fi/gyp2wdqfe81xtfvwh1cz9/Niloy_Deb_Curriculum_Vitae.pdf?rlkey=ts8ul83vt8lvj5c5tat3lb11x&st=drw83r12&dl=0"

  # Academic profiles
  arxiv            :
  googlescholar    : "https://scholar.google.com/citations?user=lhLrIrkAAAAJ&hl=en"
  impactstory      :
  orcid            : "https://orcid.org/0009-0006-4542-0895"
  semantic         :
  pubmed           :
  researchgate     : "https://www.researchgate.net/profile/Niloy-Deb-2"

  # Code
  bitbucket        :
  codepen          :
  dribbble         :
  github           : "niloydebme"      # username
  kaggle           :
  stackoverflow    :

  # Social
  bluesky          :
  facebook         :
  flickr           :
  foursquare       :
  goodreads        :
  google_plus      :
  keybase          :
  instagram        :
  lastfm           :
  linkedin         : "https://www.linkedin.com/in/niloydebin"
  mastodon         :
  medium           :
  pinterest        :
  soundcloud       :
  steam            :
  telegram         :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  wikipedia        :
  xing             :
  youtube          :
  zhihu            :


# ---------------------------------------------------------------------------
# Publications page grouping (matches `category:` in _publications/*.md)
# ---------------------------------------------------------------------------
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'
  conferences:
    title: 'Conference Papers'


# ---------------------------------------------------------------------------
# Theme behaviour
# ---------------------------------------------------------------------------
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"

comments:
  provider               : false

atom_feed:
  hide                   : true
  path                   :

google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

twitter:
  username               :
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : "profile1.png"
social:
  type                   : Person
  name                   :
  links:
    - "https://scholar.google.com/citations?user=lhLrIrkAAAAJ&hl=en"
    - "https://orcid.org/0009-0006-4542-0895"
    - "https://www.researchgate.net/profile/Niloy-Deb-2"
    - "https://www.linkedin.com/in/niloydebin"
    - "https://github.com/niloydebme"

analytics:
  provider               : false   # false, "google", "google-universal", "google-analytics-4", "custom"
  google:
    tracking_id          :


# ---------------------------------------------------------------------------
# Reading files
# ---------------------------------------------------------------------------
include:
  - _pages
  - files
exclude:
  - .sass-cache
  - .jekyll-cache
  - .bundle
  - vendor
  - node_modules
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - LICENSE
  - README.md
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# ---------------------------------------------------------------------------
# Conversion
# ---------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# ---------------------------------------------------------------------------
# Collections
# ---------------------------------------------------------------------------
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/

defaults:
  # _posts (blog is currently unused; kept so posts work if added later)
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: false
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: minimal
      author_profile: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: minimal
      author_profile: true
      share: false
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: minimal
      author_profile: true
      share: false


# ---------------------------------------------------------------------------
# Sass
# ---------------------------------------------------------------------------
sass:
  sass_dir: _sass
  style: compressed


# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
permalink: /:categories/:title/
timezone: Asia/Dhaka


# ---------------------------------------------------------------------------
# Plugins (all supported by GitHub Pages)
# ---------------------------------------------------------------------------
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/


# ---------------------------------------------------------------------------
# HTML compression
# ---------------------------------------------------------------------------
compress_html:
  clippings: all
  ignore:
    envs: development
